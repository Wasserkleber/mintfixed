# Public release labels come from mintfixed_* tags, not the Cargo package version.
# A published GitHub Release is the *only* event that publishes binaries.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
    env:
      MINTFIXED_RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the published tag with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, checkout and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          case "$MINTFIXED_RELEASE_TAG" in
            mintfixed_[0-9]*|v0.2.10-mintfixed-[0-9]*) ;;
            *) echo "Unsupported mintfixed release tag" >&2; exit 1 ;;
          esac
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse --verify "refs/tags/$MINTFIXED_RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install Rust nightly
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Linux build requirements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config gcc-mingw-w64 zip
          rustup target add x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile the checked-out release
        shell: bash
        run: cargo build --release --locked

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "${env:MINTFIXED_RELEASE_TAG}_windows_x86_64.zip"
          & ./scripts/build_release_and_experimental.ps1 -NoBuild -Tag $env:MINTFIXED_RELEASE_TAG -OutputDirectory 'dist'
          $executable = "dist/$($env:MINTFIXED_RELEASE_TAG).exe"
          Compress-Archive -Path $executable -DestinationPath $asset -Force
          "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV
          "RELEASE_EXECUTABLE=$executable" >> $env:GITHUB_ENV

      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          asset="${MINTFIXED_RELEASE_TAG}_linux_x86_64.zip"
          zip -j "$asset" target/release/mint
          echo "RELEASE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload executable to the existing published release
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release upload "$MINTFIXED_RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_EXECUTABLE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$MINTFIXED_RELEASE_TAG" "$RELEASE_ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          fi